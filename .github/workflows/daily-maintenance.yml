name: Scheduled Project Maintenance

on:
  schedule:
    - cron: "23 5 * * *"
    - cron: "41 9 * * *"
    - cron: "7 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python .github/maintenance/run_task.py
      - run: git diff --check
      - id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful change. Stopping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run project checks
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          if [ -f manage.py ]; then
            python manage.py check
            python manage.py test
          elif [ -f package.json ]; then
            npm ci
            npm run lint --if-present
            npm run build --if-present
          elif [ -f requirements.txt ]; then
            python -m compileall .
          fi
      - name: Create branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="maintenance/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git switch -c "$BRANCH"
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: scheduled project maintenance"
          git push --set-upstream origin "$BRANCH"
      - name: Open draft pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "Scheduled project maintenance" --body "Predefined repository-specific maintenance change scheduled for this date."